<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <rect width="192" height="192" rx="40" fill="#050a05"/>
  <!-- Grid background -->
  <rect x="20" y="20" width="152" height="152" rx="10" fill="#0c140c" stroke="#1c2e1c" stroke-width="2"/>
  <!-- Snake body segments -->
  <rect x="30" y="86" width="28" height="20" rx="4" fill="#009922"/>
  <rect x="62" y="86" width="20" height="20" rx="4" fill="#00cc33"/>
  <rect x="86" y="86" width="20" height="20" rx="4" fill="#00cc33"/>
  <rect x="110" y="86" width="20" height="20" rx="4" fill="#00cc33"/>
  <rect x="110" y="62" width="20" height="20" rx="4" fill="#00cc33"/>
  <rect x="110" y="38" width="20" height="20" rx="4" fill="#00cc33"/>
  <!-- Snake head -->
  <rect x="134" y="38" width="28" height="28" rx="6" fill="#00ff41" filter="url(#glow)"/>
  <!-- Eyes -->
  <circle cx="148" cy="47" r="3" fill="white"/>
  <circle cx="158" cy="47" r="3" fill="white"/>
  <circle cx="149" cy="48" r="1.5" fill="black"/>
  <circle cx="159" cy="48" r="1.5" fill="black"/>
  <!-- Food (apple) -->
  <circle cx="56" cy="140" r="12" fill="#ff4455" filter="url(#rglow)"/>
  <circle cx="52" cy="135" r="3" fill="rgba(255,255,255,0.4)"/>
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="rglow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
</svg>
